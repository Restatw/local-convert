server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/javascript application/javascript application/json
             application/manifest+json image/svg+xml application/wasm;

  include /etc/nginx/snippets/security-headers.conf;

  # Prerendered pages: /en/tools/x -> /en/tools/x/index.html
  location / {
    try_files $uri $uri/index.html =404;
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/security-headers.conf;
  }

  # Hashed build assets never change.
  location /_nuxt/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /etc/nginx/snippets/security-headers.conf;
  }

  # ffmpeg core lives in a versioned directory, so it is immutable too.
  location /ffmpeg/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /etc/nginx/snippets/security-headers.conf;
  }

  # The service worker and manifest must always be revalidated.
  location ~ ^/(sw\.js|workbox-.*\.js)$ {
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/security-headers.conf;
  }

  # nginx's default mime.types does not know .webmanifest.
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/security-headers.conf;
  }

  error_page 404 /404.html;
}
